name: CI - Build & Test Docker Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        run: docker build -t backend-img ./backend

      - name: Build frontend image
        run: docker build -t frontend-img ./frontend

      - name: Build database image
        run: docker build -t database-img ./database

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend to start
        run: sleep 5

      - name: Test API endpoint
        run: curl -f http://localhost:3000/api

      - name: Test DB endpoint
        run: curl -f http://localhost:3000/db

      - name: Stop containers
        run: docker compose down



      # 6) Done
      - name: Build complete
        run: echo "All Docker images built successfully!"
