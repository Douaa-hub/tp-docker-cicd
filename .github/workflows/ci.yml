name: CI - Build Docker images

on:
  push:
    branches: [ "main" ]

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting Docker image build workflow..."

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build backend image
        run: docker build -t tp-backend ./backend

      - name: Build frontend image
        run: docker build -t tp-frontend ./frontend

      - name: Build database image
        run: docker build -t tp-database ./database

      - name: Done
        run: echo "Images built successfully!"

